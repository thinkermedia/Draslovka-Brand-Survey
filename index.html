<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industry Survey</title>
<style>
  :root{
    --blue:#1B4F9C; --blue-dark:#123B78; --blue-light:#EAF1FB;
    --gold:#C6A15B; --ink:#1E2430; --muted:#5B6370; --border:#E1E6ED; --bg:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--blue-light);color:var(--ink);}
  .wrap{max-width:720px;margin:0 auto;min-height:100vh;background:var(--bg);
        box-shadow:0 0 40px rgba(27,79,156,0.08);display:flex;flex-direction:column;}
  header{padding:24px 32px 16px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:10px;}
  .progress-outer{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));width:0%;transition:width .3s ease;}
  main{flex:1;padding:36px 32px 24px;}
  .eyebrow{color:var(--blue);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  h1{font-size:22px;line-height:1.4;margin:0 0 22px;color:var(--ink);}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;
       display:flex;align-items:center;gap:12px;transition:.15s;background:#fff;}
  .opt:hover{border-color:var(--blue);background:var(--blue-light);}
  .opt.selected{border-color:var(--blue);background:var(--blue-light);}
  .opt input{accent-color:var(--blue);width:17px;height:17px;flex:none;}
  .opt-label{font-size:15px;}
  .other-input{margin-top:8px;width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;}
  textarea{width:100%;min-height:140px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;}
  .accordion{border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .acc-head{padding:13px 16px;font-weight:600;background:#fafbfd;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .acc-head .tag{font-size:12px;color:var(--muted);font-weight:500;}
  .acc-body{padding:6px 16px 14px;display:none;}
  .acc-body.open{display:block;}
  .grid-row-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .chip{border:1.5px solid var(--border);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;}
  .chip.selected{border-color:var(--blue);background:var(--blue);color:#fff;}
  .scale5{display:flex;justify-content:space-between;gap:6px;margin-top:4px;}
  .scale5 .pt{flex:1;text-align:center;border:1.5px solid var(--border);border-radius:8px;padding:10px 4px;cursor:pointer;font-size:12px;}
  .scale5 .pt.selected{border-color:var(--blue);background:var(--blue);color:#fff;}
  .scale5 .pt small{display:block;color:var(--muted);font-size:10px;margin-top:3px;}
  .scale5 .pt.selected small{color:#dce8fb;}
  .group-header{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
                 color:var(--blue-dark);background:var(--blue-light);padding:8px 12px;border-radius:6px;margin:14px 0 4px;}
  .group-header:first-child{margin-top:0;}
  footer{padding:18px 32px 28px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;}
  button{border:none;border-radius:8px;padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{background:#B7C6E0;cursor:not-allowed;}
  .btn-secondary{background:transparent;color:var(--muted);}
  .center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;
                  flex:1;text-align:center;padding:60px 32px;}
  .center-screen h1{font-size:24px;margin-bottom:12px;line-height:1.35;}
  .center-screen p{color:var(--muted);font-size:15px;max-width:440px;}
  .subtle{font-size:12px;color:var(--muted);margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>
  </header>
  <main id="main"></main>
  <footer id="footer" style="display:none;">
    <button class="btn-secondary" id="backBtn">Back</button>
    <button class="btn-primary" id="nextBtn" disabled>Next</button>
  </footer>
</div>

<script>
/* =========================================================================
   Draslovka Brand Survey — question config
   TMG survey programming SOP: config-driven, one question per screen,
   verbatim option text, matrix data as JSON on export.
   No client/sponsor or agency branding is shown to the respondent —
   the survey presents as unbranded throughout.
   ========================================================================= */

// ---- Reusable option lists (verbatim from QNR) --------------------------

const REGIONS = [
  "APAC & Oceania","Asia","Oceania","Central Asia & CIS","Central Asia","CIS",
  "EMEA","Africa","Europe","Middle East","Americas","North America",
  "Central America","South America"
];

const CHEM_BRANDS_AWARE = [
  "Australian Gold Reagents","Cyanco (Orica)","Cyplus","Cemex","CyPlus-Idesa",
  "Draslovka (Chemours)","Guang'an Chengxin Chemical Co","Hebei Chengxin",
  "Hindustan Chemicals Co.","JSC Rustavi Azot","Korund","Navoi Azot","Orica",
  "Proquigel Quimca","Sasol","Taekwang Industrial Co.","Saratovorgsintez LLC",
  "UPL Ltd","Yingkou Sanzheng"
];
const CHEM_STATEMENTS = ["Innovative","Trustworthy","Quality products","Customer centric","Well priced","Don't know/NA"];

const AI_BRANDS_AWARE = [
  "Aveeva","Inellisense.io","Metso Outotec","Mintek","Draslovka / MetOptima",
  "Manta Controls","Seeq","StoneThree","Orica","Trend Miner","FLS / FLSmidth","Honeywell"
];
const AI_BRANDS_USAGE = ["Draslovka / MetOptima","Intellisense.io","Manta Controls","Metso Outotec","Seeq","Mintek","Orica","Trend Miner"];
const AI_USAGE_STATEMENTS = ["We have purchased from them before","We currently use their products","I would recommend this brand","Had a poor experience"];
const AI_BRANDS_ATTR = ["Draslovka/Met Optima","Intellisense.io","Manta Controls","Metso Outotec","Minetek","Orica","Seeq","Trend Miner"];
const ATTR_STATEMENTS_6 = ["Innovative","Reliable","Trustworthy","Quality products","Customer centric","Well priced"];

const ANALYZER_BRANDS = [
  "Blue Cube (Draslovka)","JC Bachmann","FLSmidth","Gekko Systems","Metso Outotec",
  "Metrohm Process Analytics","Malvern Panalytical","MolyCop","RealTime Instruments",
  "SABIA","Sensmet","Thermo Fisher Scientific","Xore","Xylem"
];
const ANALYZER_STATEMENTS = ["I am familiar with this brand","We have purchased from them before","We currently use their products","I would recommend this brand","Had a poor experience"];

const CONTENT_TYPES = [
  "Case studies / testimonials","Tutorial / Explainer videos","Podcasts","Video interviews",
  "White papers / reports","Articles","Data infographics","Live Q&A webinars",
  "On-demand webinars","Other, please specify:"
];

// ---- Q3 role list, tiered (verbatim labels, tier used for QTIER + Q4 skip) ----
const ROLES = [
  {group:"Tier 1: Primary Decision Makers & Champions", tier:1, items:[
    "CEO","General Manager (GM)","Mine General Manager (Mine GM)",
    {label:"Chief Metallurgist (Chief Met)", metOK:true},
    "Chief Commercial Officer (CCO)","Chief Operating Officer / VP Operations (COO / VP Ops)",
    "Chief Strategy Officer (CSO)","Chief Technology Officer (CTO)"
  ]},
  {group:"Tier 2: Core Technical Influencers", tier:2, items:[
    {label:"Process Manager", metOK:true},
    {label:"Metallurgy Team", metOK:true},
    {label:"Mill / Leach Manager", metOK:true},
    {label:"Tech Services Manager", metOK:true},
    "Maintenance / Reliability Manager",
    {label:"Lab / Analytical Manager", metOK:true}
  ]},
  {group:"Tier 3: Technical Specialists & Solution Evaluators", tier:3, items:[
    {label:"Tech Services / Metallurgy", metOK:true},
    "Innovation Centre of Excellence","Technology Centre of Excellence",
    "Digital Transformation Team","APC / Process Control Manager"
  ]},
  {group:"Tier 4: Technology, Automation & Data Stakeholders", tier:4, items:[
    "CIO / Innovation Centre of Excellence","CIO / Head of IT",
    "APC / Automation / Optimisation Manager","AI Projects Lead",
    "BI / Data Analytics","CISO / IT Security / Cybersecurity"
  ]},
  {group:"Tier 5: Procurement, Commercial Support & Operational Teams", tier:5, items:[
    "Asset Management","Sourcing Specialist","Projects Manager","Operations Team"
  ]}
];

// ---- Q7 commodities (verbatim, V4 list) ----
const COMMODITIES = [
  {value:"au", label:"Gold (Au)"}, {value:"ag", label:"Silver (Ag)"},
  {value:"cu", label:"Copper (Cu)"}, {value:"ni", label:"Nickel (Ni)"},
  {value:"co", label:"Cobalt (Co)"}, {value:"pb", label:"Lead (Pb)"},
  {value:"zn", label:"Zinc (Zn)"},
  {value:"pgm", label:"Platinum Group Metals / PGMs (Platinum, Palladium, Rhodium, Ruthenium, Iridium, Osmium)"},
  {value:"ree", label:"Rare Earth Elements (REEs)"}, {value:"li", label:"Lithium (Li)"},
  {value:"fe", label:"Iron (Fe)"}, {value:"mo", label:"Molybdenum (Mo)"},
  {value:"sn", label:"Tin (Sn)"}, {value:"phos", label:"Phosphate"},
  {value:"potash", label:"Potash"}, {value:"fluorite", label:"Fluorite"},
  {value:"silica", label:"Silica / Quartz"}, {value:"clays", label:"Clays"},
  {value:"cr", label:"Chrome (Cr)"}, {value:"mn", label:"Manganese (Mn)"},
  {value:"u", label:"Uranium (U)"}, {value:"mg", label:"Magnesium (Mg)"},
  {value:"other", label:"Other: please specify", isOther:true}
];
const CYANIDE_TRIGGER = ["au","ag","cu"]; // Q8 only asked if any of these selected in Q7

// =========================================================================
// QUESTIONS — one entry per screen. type: single | multi | tiered_single |
// rating_grid | stmt_grid | open
// =========================================================================
const QUESTIONS = [

  { id:"Q1", code:"Q1", type:"single", terminateOnLabel:"Other (terminate)",
    prompt:"What is the industry sector that you work in?",
    options:["Mining & Extraction","Other (terminate)"] },

  { id:"Q2", code:"Q2", type:"single",
    prompt:"Are you based at the Mine Site, or at a Corporate Head Office?",
    options:["Mine site","Corporate Head Office","Work remotely"] },

  { id:"Q3", code:"Q3", type:"tiered_single",
    prompt:"What best describes your role?",
    groups: ROLES, other:true },

  { id:"Q4", code:"Q4", type:"single",
    prompt:"Are you involved in technology & vendor selection within the mineral processing plant?",
    options:["Yes – influence technology/vendor selection","Yes – final approval","No"],
    terminateIf:(val,a)=>{
      if(val!=="No") return null;
      const role = getRoleMeta(a.Q3);
      if(role && role.metOK) return null; // exception: Metallurgy/Processing roles pass
      return "Not involved in technology/vendor selection, and role is outside Metallurgy/Processing.";
    }},

  { id:"Q5", code:"Q5", type:"rating_grid_single",
    prompt:"How familiar are you with the following areas of mining?",
    rows:[
      {value:"chem", label:"Leaching chemicals / reagents"},
      {value:"ai", label:"Mining AI / analytics software"},
      {value:"analyzer", label:"Mineral / elemental analyzers eg XRF"}
    ],
    cols:["Not Familiar","Somewhat Familiar","Familiar","Very Familiar"],
    terminateIf:(val,a)=>{
      const allNotFamiliar = ["chem","ai","analyzer"].every(r=>val[r]==="Not Familiar");
      return allNotFamiliar ? "Not familiar with any of the three mining areas." : null;
    }},

  { id:"Q6", code:"Q6", type:"single",
    prompt:"In which region are you based?",
    options: REGIONS },

  { id:"Q7", code:"Q7", type:"multi",
    prompt:"Which metals/minerals does your company mine?",
    options: COMMODITIES.map(c=>c.label) },

  { id:"Q8", code:"Q8", type:"single",
    prompt:"Do you currently use sodium cyanide in your metal leaching process?",
    options:["Yes","No","Don't Know"],
    showIf:(a)=> (a.Q7||[]).some(v => v.startsWith("Gold")||v.startsWith("Silver")||v.startsWith("Copper")) },

  { id:"Q9", code:"Q9", type:"single",
    prompt:"Have you heard of Glycine Leaching Technology before?",
    options:["Yes","No","Don't Know"] },

  { id:"Q10", code:"Q10", type:"single",
    prompt:"Do you personally use any AI, Machine Learning, or advanced analytics tools to help you with your own work tasks?",
    options:["Yes","No","Not sure"] },

  { id:"Q11", code:"Q11", type:"scale5",
    prompt:"Overall, do you see AI / Machine Learning in mineral processing as mostly supplier hype, genuine innovation, or somewhere in between?",
    scaleLabels:{1:"Mostly supplier hype",3:"A mix of both",5:"Genuine innovation"} },

  { id:"Q12", code:"Q12", type:"rating_grid_scale5",
    prompt:"On a scale of 1 to 5, how much do you agree with each statement?",
    scaleLabels:{1:"Completely disagree",3:"Neutral",5:"Completely agree"},
    rows:[
      "My organisation should invest more in AI technologies.",
      "I am sceptical about many supplier claims made about AI.",
      "I am concerned that AI will replace me in my job",
      "I feel AI is a useful tool that frees up my time to focus on more important tasks",
      "I feel overwhelmed by the pace at which AI technology is evolving.",
      "AI is a cybersecurity risk and shouldn't be trusted with company data",
      "AI is not mature enough yet to be trusted with important tasks – it needs a lot of human oversight",
      "Using AI is harmful to the environment and should be avoided as far as possible",
      "I believe the benefits of AI outweigh the risks."
    ]},

  // ---- Chemical supplier section (gated on Q5.chem >= Somewhat Familiar) ----
  { id:"Q13", code:"Q13", type:"multi", section:"Chemical Supplier",
    prompt:"When you think of sodium cyanide suppliers, which of the following brands are you aware of?",
    options: CHEM_BRANDS_AWARE.concat(["Other"]),
    disqualifyOn:"Cemex",
    showIf:(a)=> a.Q5 && a.Q5.chem !== "Not Familiar" },

  { id:"Q13a", code:"Q13a", type:"most_pipe", pipeFrom:"Q13", section:"Chemical Supplier",
    prompt:"Which one sodium cyanide supplier would you most likely recommend?",
    showIf:(a)=> a.Q5 && a.Q5.chem !== "Not Familiar" && (a.Q13||[]).length>0 },

  { id:"Q14", code:"Q14", type:"stmt_grid", section:"Chemical Supplier", pipeFrom:"Q13",
    excludeFromPipe:["Cemex","Other"],
    prompt:"Please indicate which of the below statements are true for the following chemical supplier brands.",
    stmts: CHEM_STATEMENTS,
    showIf:(a)=> a.Q5 && a.Q5.chem !== "Not Familiar" && (a.Q13||[]).filter(x=>x!=="Cemex").length>0 },

  // ---- Mining AI Software section (gated on Q5.ai >= Somewhat Familiar) ----
  { id:"Q15", code:"Q15", type:"multi", section:"Mining AI Software",
    prompt:"When you think of Mining AI software suppliers, which brands come to mind?",
    options: AI_BRANDS_AWARE.concat(["Other"]),
    showIf:(a)=> a.Q5 && a.Q5.ai !== "Not Familiar" },

  { id:"Q15a", code:"Q15a", type:"most_pipe", pipeFrom:"Q15", section:"Mining AI Software",
    prompt:"Which brand would you rate as the most innovative?",
    showIf:(a)=> a.Q5 && a.Q5.ai !== "Not Familiar" && (a.Q15||[]).length>0 },

  { id:"Q16", code:"Q16", type:"stmt_grid_fixed", section:"Mining AI Software",
    rowsFixed: AI_BRANDS_USAGE,
    prompt:"Please select the statements that apply for these Mining AI Software suppliers.",
    stmts: AI_USAGE_STATEMENTS,
    showIf:(a)=> a.Q5 && a.Q5.ai !== "Not Familiar" },

  { id:"Q17", code:"Q17", type:"stmt_grid_fixed", section:"Mining AI Software",
    rowsFixed: AI_BRANDS_ATTR,
    prompt:"Please select the statements that apply for these Mining AI Software suppliers.",
    stmts: ATTR_STATEMENTS_6,
    showIf:(a)=> a.Q5 && a.Q5.ai !== "Not Familiar" },

  { id:"Q18", code:"Q18", type:"single", section:"Mining AI Software",
    prompt:"Which best describes your operation's plans for AI adoption in the mill/mineral processing plant?",
    options:[
      "We are already using AI","Actively planning to implement AI in the next 12-months",
      "Actively planning to implement AI in the next 2 years","Currently implementing AI",
      "Considering AI but no firm plans","Not currently considering AI",
      "Don't know enough about AI to decide"
    ],
    showIf:(a)=> a.Q5 && a.Q5.ai !== "Not Familiar" },

  // ---- Mineral Analyzer section (gated on Q5.analyzer >= Somewhat Familiar) ----
  { id:"Q19", code:"Q19", type:"stmt_grid_fixed", section:"Mineral Analyzer",
    rowsFixed: ANALYZER_BRANDS,
    prompt:"Please select the statements that apply for these Mineral Analyzer suppliers.",
    stmts: ANALYZER_STATEMENTS,
    showIf:(a)=> a.Q5 && a.Q5.analyzer !== "Not Familiar" },

  { id:"Q20", code:"Q20", type:"stmt_grid_dynamic_from_q19", section:"Mineral Analyzer",
    sourceQ:"Q19", sourceStmt:"I am familiar with this brand",
    prompt:"Please select the statements that apply for these Mineral Analyzer suppliers.",
    stmts: ATTR_STATEMENTS_6,
    showIf:(a)=> a.Q5 && a.Q5.analyzer !== "Not Familiar" },

  // ---- Content format ----
  { id:"Q21", code:"Q21", type:"content_pref", section:"Content format",
    prompt:"We're building a Mineral Processing content hub for the Processing team on the latest technologies and industry trends — please select what content you/your team currently use, and which format is most valuable.",
    rows: CONTENT_TYPES },

  { id:"Q22", code:"Q22", type:"open", section:"Content format",
    prompt:"What topics would you like to hear about in the area of Mineral Processing? Include any topics that interest you, or areas that pose a challenge for your team/s." }
];

function getRoleMeta(label){
  for(const g of ROLES){
    for(const it of g.items){
      const lbl = typeof it==="string" ? it : it.label;
      if(lbl===label) return typeof it==="string" ? {label:lbl, tier:g.tier} : {...it, tier:g.tier};
    }
  }
  return null;
}
function getRoleTier(label){
  const m = getRoleMeta(label);
  return m ? m.tier : null;
}

</script>
<script>
/* =========================================================================
   Engine
   ========================================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyY20mVUpN8B7z5YdIxkhwhmgauMyedgP2d9sxgtPThMVBD501hSeJtWzKLg-S0lDTAxA/exec";

const params = new URLSearchParams(location.search);
const REF = params.get('ref') || ('anon_' + Date.now());
const SRC = (params.get('src') || 'panel').toLowerCase(); // 'abm' | 'panel'
const STORAGE_KEY = 'tmg_used_' + REF;

let answers = {};
let history_ = [];   // visited question ids, for Back
let currentId = null;
let startTime = Date.now();
let disqualified = null;

function visibleQuestions(){
  return QUESTIONS.filter(q => !q.showIf || q.showIf(answers));
}
function nextQuestionId(afterId){
  const vis = visibleQuestions();
  const idx = afterId ? vis.findIndex(q=>q.id===afterId) : -1;
  for(let i=idx+1;i<vis.length;i++) return vis[i].id;
  return null; // end of survey
}
function prevQuestionId(){
  if(history_.length===0) return null;
  return history_[history_.length-1];
}
function getQ(id){ return QUESTIONS.find(q=>q.id===id); }

function updateProgress(){
  const vis = visibleQuestions();
  const idx = vis.findIndex(q=>q.id===currentId);
  const pct = vis.length ? Math.round(((idx+1)/vis.length)*100) : 0;
  document.getElementById('progressBar').style.width = pct+'%';
}

function start(){
  checkLockThenBegin();
}

function checkLockThenBegin(){
  if(localStorage.getItem(STORAGE_KEY)==='1'){ return renderAlreadyUsed(); }
  // best-effort server check; if it fails (offline/misconfigured) fall through to local-only lock
  fetch(SCRIPT_URL+'?action=checkLock&ref='+encodeURIComponent(REF))
    .then(r=>r.json()).then(d=>{
      if(d && d.used){ localStorage.setItem(STORAGE_KEY,'1'); renderAlreadyUsed(); }
      else { renderIntro(); }
    }).catch(()=> renderIntro());
}

function renderIntro(){
  document.getElementById('footer').style.display='none';
  document.getElementById('main').innerHTML = `
    <div class="center-screen">
      <h1>Industry Survey</h1>
      <p>Thank you for taking part. This survey covers your role, your operation, and how your team
      evaluates technology and suppliers in mineral processing. It takes about 8–10 minutes.
      Your individual responses are kept confidential and reported only in aggregate.</p>
      <button class="btn-primary" style="margin-top:22px;" id="beginBtn">Begin Survey</button>
    </div>`;
  document.getElementById('beginBtn').onclick = ()=>{
    logCounter('start');
    goTo(nextQuestionId(null));
  };
}

function renderAlreadyUsed(){
  document.getElementById('footer').style.display='none';
  document.getElementById('main').innerHTML = `
    <div class="center-screen">
      <h1>This link has already been used</h1>
      <p>Our records show this survey link has already been completed. If you believe this is an error,
      please contact the person who sent you this link.</p>
    </div>`;
}

function renderDisqualify(reason){
  disqualified = reason;
  finalizeSubmit(true);
  document.getElementById('footer').style.display='none';
  document.getElementById('main').innerHTML = `
    <div class="center-screen">
      <h1>Thank you</h1>
      <p>At this time, you don't qualify for this particular survey based on your answers so far.
      We appreciate your time.</p>
    </div>`;
}

function renderThankYou(){
  finalizeSubmit(false);
  document.getElementById('footer').style.display='none';
  document.getElementById('main').innerHTML = `
    <div class="center-screen">
      <h1>Thank you</h1>
      <p>Your responses have been recorded. We appreciate you taking the time to share your perspective.</p>
    </div>`;
}

function goTo(id){
  if(!id){ return renderThankYou(); }
  if(currentId) history_.push(currentId);
  currentId = id;
  renderQuestion(getQ(id));
  updateProgress();
}

function goBack(){
  const prev = prevQuestionId();
  if(!prev) return;
  history_.pop();
  currentId = prev;
  renderQuestion(getQ(prev));
  updateProgress();
}

function setNextEnabled(ok){ document.getElementById('nextBtn').disabled = !ok; }

function handleNext(){
  const q = getQ(currentId);
  // run termination checks
  const val = answers[q.id];
  if(q.type==='single' && q.terminateOnLabel && val===q.terminateOnLabel){
    return renderDisqualify(`${q.code}: selected "${val}"`);
  }
  if(q.terminateIf){
    const reason = q.terminateIf(val, answers);
    if(reason) return renderDisqualify(`${q.code}: ${reason}`);
  }
  if(q.type==='multi' && q.disqualifyOn && (val||[]).includes(q.disqualifyOn)){
    return renderDisqualify(`${q.code}: selected disqualifying brand "${q.disqualifyOn}"`);
  }
  goTo(nextQuestionId(q.id));
}

/* ---------------- Renderers ---------------- */
function renderQuestion(q){
  document.getElementById('footer').style.display='flex';
  document.getElementById('backBtn').style.visibility = history_.length? 'visible':'hidden';
  const main = document.getElementById('main');
  const eyebrow = q.section ? `<div class="eyebrow">${q.section}</div>` : '';
  main.innerHTML = `${eyebrow}<h1>${q.prompt}</h1><div id="qbody"></div>`;
  const body = document.getElementById('qbody');
  setNextEnabled(false);

  if(q.type==='single') renderSingle(q, body);
  else if(q.type==='tiered_single') renderTieredSingle(q, body);
  else if(q.type==='multi') renderMulti(q, body);
  else if(q.type==='most_pipe') renderMostPipe(q, body);
  else if(q.type==='rating_grid_single') renderRatingGridSingle(q, body);
  else if(q.type==='scale5') renderScale5(q, body, 'Q11');
  else if(q.type==='rating_grid_scale5') renderRatingGridScale5(q, body);
  else if(q.type==='stmt_grid') renderStmtGrid(q, body, (answers[q.pipeFrom]||[]).filter(v=>!(q.excludeFromPipe||[]).includes(v)));
  else if(q.type==='stmt_grid_fixed') renderStmtGrid(q, body, q.rowsFixed);
  else if(q.type==='stmt_grid_dynamic_from_q19') renderStmtGridDynamic(q, body);
  else if(q.type==='content_pref') renderContentPref(q, body);
  else if(q.type==='open') renderOpen(q, body);

  document.getElementById('nextBtn').onclick = handleNext;
  document.getElementById('backBtn').onclick = goBack;
}

function renderSingle(q, body){
  const opts = q.options;
  const wrap = document.createElement('div'); wrap.className='opts';
  opts.forEach(label=>{
    const row = document.createElement('label'); row.className='opt';
    row.innerHTML = `<input type="radio" name="${q.id}" value="${escapeHtml(label)}"><span class="opt-label">${escapeHtml(label)}</span>`;
    row.querySelector('input').checked = answers[q.id]===label;
    if(answers[q.id]===label) row.classList.add('selected');
    row.onclick = ()=>{
      answers[q.id]=label;
      [...wrap.children].forEach(c=>c.classList.remove('selected'));
      row.classList.add('selected');
      setNextEnabled(true);
    };
    wrap.appendChild(row);
  });
  body.appendChild(wrap);
}

function renderTieredSingle(q, body){
  const wrap = document.createElement('div');
  q.groups.forEach(g=>{
    const h = document.createElement('div'); h.className='group-header'; h.textContent = g.group;
    wrap.appendChild(h);
    const opts = document.createElement('div'); opts.className='opts';
    g.items.forEach(it=>{
      const label = typeof it==='string' ? it : it.label;
      const row = document.createElement('label'); row.className='opt';
      row.innerHTML = `<input type="radio" name="${q.id}" value="${escapeHtml(label)}"><span class="opt-label">${escapeHtml(label)}</span>`;
      if(answers[q.id]===label){ row.classList.add('selected'); row.querySelector('input').checked=true; }
      row.onclick = ()=>{
        answers[q.id]=label;
        answers.QTIER = getRoleTier(label);
        [...document.querySelectorAll(`input[name="${q.id}"]`)].forEach(r=>r.closest('.opt').classList.remove('selected'));
        row.classList.add('selected');
        setNextEnabled(true);
      };
      opts.appendChild(row);
    });
    wrap.appendChild(opts);
  });
  if(q.other){
    const h = document.createElement('div'); h.className='group-header'; h.textContent='Other';
    wrap.appendChild(h);
    const row = document.createElement('label'); row.className='opt';
    row.innerHTML = `<input type="radio" name="${q.id}" value="Other"><span class="opt-label">Other: please specify</span>`;
    const otherInput = document.createElement('input'); otherInput.className='other-input'; otherInput.placeholder='Insert role';
    otherInput.style.display='none';
    row.onclick = ()=>{
      answers[q.id]='Other'; answers.QTIER=null;
      otherInput.style.display='block';
      [...document.querySelectorAll(`input[name="${q.id}"]`)].forEach(r=>r.closest('.opt').classList.remove('selected'));
      row.classList.add('selected');
      setNextEnabled(!!otherInput.value.trim());
    };
    otherInput.oninput = ()=>{ answers.Q3_other = otherInput.value; setNextEnabled(!!otherInput.value.trim()); };
    wrap.appendChild(row); wrap.appendChild(otherInput);
  }
  body.appendChild(wrap);
}

function renderMulti(q, body){
  if(!answers[q.id]) answers[q.id]=[];
  const wrap = document.createElement('div'); wrap.className='opts';
  let otherInput=null;
  q.options.forEach(label=>{
    const row = document.createElement('label'); row.className='opt';
    row.innerHTML = `<input type="checkbox" value="${escapeHtml(label)}"><span class="opt-label">${escapeHtml(label)}</span>`;
    const isSel = answers[q.id].includes(label);
    if(isSel) row.classList.add('selected');
    row.querySelector('input').checked = isSel;
    row.onclick = (e)=>{
      e.preventDefault();
      const arr = answers[q.id];
      const i = arr.indexOf(label);
      if(i>-1){ arr.splice(i,1); row.classList.remove('selected'); row.querySelector('input').checked=false; }
      else { arr.push(label); row.classList.add('selected'); row.querySelector('input').checked=true; }
      if(label.startsWith('Other') && otherInput){ otherInput.style.display = arr.includes(label)?'block':'none'; }
      setNextEnabled(arr.length>0);
    };
    wrap.appendChild(row);
    if(label.startsWith('Other')){
      otherInput = document.createElement('input');
      otherInput.className='other-input'; otherInput.placeholder='Please specify'; otherInput.style.display='none';
      otherInput.oninput = ()=>{ answers[q.id+'_other']=otherInput.value; };
      wrap.appendChild(otherInput);
    }
  });
  body.appendChild(wrap);
  setNextEnabled(answers[q.id].length>0);
}

function renderMostPipe(q, body){
  const opts = (answers[q.pipeFrom]||[]);
  const wrap = document.createElement('div'); wrap.className='opts';
  opts.forEach(label=>{
    const row = document.createElement('label'); row.className='opt';
    row.innerHTML = `<input type="radio" name="${q.id}" value="${escapeHtml(label)}"><span class="opt-label">${escapeHtml(label)}</span>`;
    if(answers[q.id]===label) row.classList.add('selected');
    row.onclick = ()=>{
      answers[q.id]=label;
      [...wrap.children].forEach(c=>c.classList.remove('selected'));
      row.classList.add('selected');
      setNextEnabled(true);
    };
    wrap.appendChild(row);
  });
  body.appendChild(wrap);
}

function renderRatingGridSingle(q, body){
  if(!answers[q.id]) answers[q.id]={};
  const wrap = document.createElement('div');
  q.rows.forEach(r=>{
    const acc = document.createElement('div'); acc.className='accordion';
    const cur = answers[q.id][r.value];
    acc.innerHTML = `<div class="acc-head">${escapeHtml(r.label)}<span class="tag">${cur?escapeHtml(cur):'Tap to answer'}</span></div>
                      <div class="acc-body"><div class="grid-row-options"></div></div>`;
    const optsWrap = acc.querySelector('.grid-row-options');
    q.cols.forEach(col=>{
      const chip = document.createElement('div'); chip.className='chip'; chip.textContent=col;
      if(cur===col) chip.classList.add('selected');
      chip.onclick = ()=>{
        answers[q.id][r.value]=col;
        [...optsWrap.children].forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        acc.querySelector('.tag').textContent = col;
        checkGridComplete();
      };
      optsWrap.appendChild(chip);
    });
    acc.querySelector('.acc-head').onclick = ()=>{
      const b = acc.querySelector('.acc-body'); b.classList.toggle('open');
    };
    wrap.appendChild(acc);
  });
  body.appendChild(wrap);
  function checkGridComplete(){
    const done = q.rows.every(r=>answers[q.id][r.value]);
    setNextEnabled(done);
  }
  checkGridComplete();
}

function renderScale5(q, body){
  if(answers[q.id]===undefined) answers[q.id]=null;
  const wrap = document.createElement('div'); wrap.className='scale5';
  for(let i=1;i<=5;i++){
    const pt = document.createElement('div'); pt.className='pt';
    pt.innerHTML = `${i}${q.scaleLabels[i]?`<small>${q.scaleLabels[i]}</small>`:''}`;
    if(answers[q.id]===i) pt.classList.add('selected');
    pt.onclick = ()=>{
      answers[q.id]=i;
      [...wrap.children].forEach(c=>c.classList.remove('selected'));
      pt.classList.add('selected');
      setNextEnabled(true);
    };
    wrap.appendChild(pt);
  }
  body.appendChild(wrap);
}

// Q12: 9-statement battery, chunked 5 + 4 per SOP (long batteries paginate)
function renderRatingGridScale5(q, body){
  if(!answers[q.id]) answers[q.id]={};
  if(!q._page) q._page=0;
  const chunks = chunk(q.rows,5);
  const pageRows = chunks[q._page];
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="subtle" style="margin-bottom:10px;">Part ${q._page+1} of ${chunks.length}</div>`;
  pageRows.forEach(stmt=>{
    const block = document.createElement('div'); block.style.marginBottom='18px';
    block.innerHTML = `<div style="font-size:14px;margin-bottom:6px;">${escapeHtml(stmt)}</div>`;
    const scale = document.createElement('div'); scale.className='scale5';
    for(let i=1;i<=5;i++){
      const pt = document.createElement('div'); pt.className='pt';
      pt.innerHTML = `${i}${q.scaleLabels[i]?`<small>${q.scaleLabels[i]}</small>`:''}`;
      if(answers[q.id][stmt]===i) pt.classList.add('selected');
      pt.onclick=()=>{
        answers[q.id][stmt]=i;
        [...scale.children].forEach(c=>c.classList.remove('selected'));
        pt.classList.add('selected');
        checkPageComplete();
      };
      scale.appendChild(pt);
    }
    block.appendChild(scale);
    wrap.appendChild(block);
  });
  body.appendChild(wrap);
  function checkPageComplete(){
    const done = pageRows.every(s=>answers[q.id][s]!==undefined);
    setNextEnabled(done);
  }
  checkPageComplete();
  // override Next to paginate within this question before moving on
  const origNext = document.getElementById('nextBtn').onclick;
  document.getElementById('nextBtn').onclick = ()=>{
    if(q._page < chunks.length-1){ q._page++; renderQuestion(q); }
    else { q._page=0; handleNext(); }
  };
}

function renderStmtGrid(q, body, rowLabels){
  if(!answers[q.id]) answers[q.id]={};
  const wrap = document.createElement('div');
  rowLabels.forEach(r=>{
    if(!answers[q.id][r]) answers[q.id][r]=[];
    const acc = document.createElement('div'); acc.className='accordion';
    acc.innerHTML = `<div class="acc-head">${escapeHtml(r)}<span class="tag">${answers[q.id][r].length} selected</span></div>
                      <div class="acc-body"><div class="grid-row-options"></div></div>`;
    const optsWrap = acc.querySelector('.grid-row-options');
    q.stmts.forEach(s=>{
      const chip = document.createElement('div'); chip.className='chip'; chip.textContent=s;
      if(answers[q.id][r].includes(s)) chip.classList.add('selected');
      chip.onclick=()=>{
        const arr = answers[q.id][r];
        const i = arr.indexOf(s);
        if(i>-1) arr.splice(i,1); else arr.push(s);
        chip.classList.toggle('selected');
        acc.querySelector('.tag').textContent = arr.length+' selected';
      };
      optsWrap.appendChild(chip);
    });
    acc.querySelector('.acc-head').onclick=()=>acc.querySelector('.acc-body').classList.toggle('open');
    wrap.appendChild(acc);
  });
  body.appendChild(wrap);
  setNextEnabled(true); // statement grids allow zero-selection rows (SOP: zero-response rows are valid)
}

function renderStmtGridDynamic(q, body){
  const src = answers[q.sourceQ] || {};
  const rowLabels = Object.keys(src).filter(brand => (src[brand]||[]).includes(q.sourceStmt));
  if(rowLabels.length===0){ body.innerHTML = '<p class="subtle">No brands flagged as familiar in the previous question — continuing.</p>'; setNextEnabled(true); return; }
  renderStmtGrid(q, body, rowLabels);
}

function renderContentPref(q, body){
  if(!answers[q.id]) answers[q.id]={use:[], most:null};
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="eyebrow" style="margin-bottom:8px;">Which do you currently use?</div>`;
  const optsWrap = document.createElement('div'); optsWrap.className='opts';
  q.rows.forEach(r=>{
    const row = document.createElement('label'); row.className='opt';
    row.innerHTML = `<input type="checkbox" value="${escapeHtml(r)}"><span class="opt-label">${escapeHtml(r)}</span>`;
    const sel = answers[q.id].use.includes(r);
    if(sel) row.classList.add('selected');
    row.querySelector('input').checked = sel;
    row.onclick=(e)=>{
      e.preventDefault();
      const arr = answers[q.id].use;
      const i = arr.indexOf(r);
      if(i>-1) arr.splice(i,1); else arr.push(r);
      row.classList.toggle('selected');
      row.querySelector('input').checked = arr.includes(r);
      renderMostSection();
    };
    optsWrap.appendChild(row);
  });
  wrap.appendChild(optsWrap);
  const mostHeader = document.createElement('div'); mostHeader.className='eyebrow';
  mostHeader.style.margin='18px 0 8px'; mostHeader.textContent='Which format is most valuable to you?';
  wrap.appendChild(mostHeader);
  const mostWrap = document.createElement('div'); mostWrap.className='opts';
  wrap.appendChild(mostWrap);
  body.appendChild(wrap);
  renderMostSection();
  function renderMostSection(){
    mostWrap.innerHTML='';
    const pool = answers[q.id].use.length ? answers[q.id].use : q.rows;
    pool.forEach(r=>{
      const row = document.createElement('label'); row.className='opt';
      row.innerHTML = `<input type="radio" name="${q.id}_most" value="${escapeHtml(r)}"><span class="opt-label">${escapeHtml(r)}</span>`;
      if(answers[q.id].most===r) row.classList.add('selected');
      row.onclick=()=>{
        answers[q.id].most=r;
        [...mostWrap.children].forEach(c=>c.classList.remove('selected'));
        row.classList.add('selected');
        setNextEnabled(true);
      };
      mostWrap.appendChild(row);
    });
    setNextEnabled(!!answers[q.id].most);
  }
}

function renderOpen(q, body){
  const ta = document.createElement('textarea');
  ta.value = answers[q.id]||'';
  ta.placeholder = 'Your answer...';
  ta.oninput = ()=>{ answers[q.id]=ta.value; setNextEnabled(ta.value.trim().length>0); };
  body.appendChild(ta);
  setNextEnabled((answers[q.id]||'').trim().length>0);
}

/* ---------------- Helpers ---------------- */
function chunk(arr,n){ const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function logCounter(kind){
  fetch(SCRIPT_URL, {method:'POST', mode:'no-cors',
    body: JSON.stringify({action:'counter', kind, ref:REF, src:SRC})}).catch(()=>{});
}

function flattenForExport(){
  // Header/value pairs: QNR code + verbatim question text leads each column,
  // flat multi-selects get one column per option (1/0), grids export as JSON.
  const out = [
    {header:'ref', value:REF},
    {header:'source (ABM/Panel)', value:SRC},
    {header:'QTIER', value: answers.QTIER || ''},
    {header:'disqualified', value: disqualified ? 'yes' : 'no'},
    {header:'disqualify_reason', value: disqualified || ''},
    {header:'start_time_ist', value: new Date(startTime).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})},
    {header:'end_time_ist', value: new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})},
  ];
  QUESTIONS.forEach(q=>{
    const v = answers[q.id];
    if(v===undefined) return;
    if(q.type==='multi'){
      q.options.forEach(opt=> out.push({header:`${q.code} - ${q.prompt} [${opt}]`, value: (v||[]).includes(opt)?1:0}));
      if(answers[q.id+'_other']) out.push({header:`${q.code} - Other specify`, value: answers[q.id+'_other']});
    } else if(q.type==='rating_grid_single'){
      out.push({header:`${q.code} - ${q.prompt} (grid JSON)`, value: JSON.stringify(v)});
    } else if(q.type==='rating_grid_scale5'){
      out.push({header:`${q.code} - ${q.prompt} (grid JSON)`, value: JSON.stringify(v)});
    } else if(q.type==='stmt_grid' || q.type==='stmt_grid_fixed' || q.type==='stmt_grid_dynamic_from_q19'){
      out.push({header:`${q.code} - ${q.prompt} (grid JSON)`, value: JSON.stringify(v)});
    } else if(q.type==='content_pref'){
      out.push({header:`${q.code} - currently use (JSON)`, value: JSON.stringify(v.use)});
      out.push({header:`${q.code} - most valuable`, value: v.most});
    } else {
      out.push({header:`${q.code} - ${q.prompt}`, value: v});
      if(q.id==='Q3' && answers.Q3_other) out.push({header:'Q3 - Other specify', value: answers.Q3_other});
    }
  });
  return out;
}

function finalizeSubmit(isDisqualified){
  localStorage.setItem(STORAGE_KEY,'1');
  const rowData = flattenForExport();
  fetch(SCRIPT_URL, {method:'POST', mode:'no-cors',
    body: JSON.stringify({action:'submit', ref:REF, disqualified:isDisqualified, rowData})}).catch(()=>{});
}

start();
</script>
